name: Render video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render src/index.ts AuraVideo out/video.mp4 --codec=h264

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error
