name: Render video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    name: Render ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: AuraVideo
            output: video.mp4
            artifact: video
            guion: ""
            flags: ""
          - id: CuerpoExtremo
            output: cuerpo-extremo.mp4
            artifact: cuerpo-extremo
            guion: src/cuerpo/guion.json
            manifiesto: public/audio/voz.json
            flags: ""
          - id: Stallone
            output: stallone-106-dolares.mp4
            artifact: stallone-106-dolares
            guion: src/stallone/guion.json
            manifiesto: public/audio/stallone/voz.json
            # el grano de película es ruido: sin límite de bitrate el MP4 pesaba 2,2 GB
            flags: --video-bitrate=6M
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts mutagen

      - name: Install system dependencies for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Generate narration (edge-tts)
        if: ${{ matrix.guion != '' }}
        run: |
          python scripts/generar-voz.py ${{ matrix.guion }}
          test -f ${{ matrix.manifiesto }}

      - name: Render video
        run: npx remotion render src/index.ts ${{ matrix.id }} out/${{ matrix.output }} --codec=h264 ${{ matrix.flags }}

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.output }}
          if-no-files-found: error
